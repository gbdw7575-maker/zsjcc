version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: tft-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-please_change_mongo_password}

  backend:
    build: ./server
    container_name: tft-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-please_change_mongo_password}@mongo:27017/tft_assistant?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-please_change_jwt_secret}
      - JWT_EXPIRE=7d
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      # AI 分析代理所用密钥（服务端持有，不下发前端）
      - AI_API_KEY=${AI_API_KEY:-}
    depends_on:
      - mongo
    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tft-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
